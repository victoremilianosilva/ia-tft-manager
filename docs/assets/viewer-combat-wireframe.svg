<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">TFT Viewer — batalha detalhada</title><desc id="desc">Tela conceitual de combate com todas as unidades dos dois lados, grades de posição, barras de vida e mana, painel de eventos e controles de replay. Dados e posições são ilustrativos; atualização real depende dos eventos da engine.</desc>
