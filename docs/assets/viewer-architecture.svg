<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Arquitetura proposta do visualizador TFT</title><desc id="desc">Política PPO em Python, controlador, engine C++, camada de eventos e replay, interface e persistência.</desc><defs><style>.bg{fill:#f7f8fb}.b{fill:#fff;stroke:#344054;stroke-width:2}.bl{fill:#e8f1ff;stroke:#3973ac;stroke-width:2}.gr{fill:#e9f7ef;stroke:#32835a;stroke-width:2}.pu{fill:#f2eaff;stroke:#7952a8;stroke-width:2}.or{fill:#fff0df;stroke:#b76b1e;stroke-width:2}.t{font:700 23px Arial,sans-serif;fill:#182230}.s{font:18px Arial,sans-serif;fill:#344054}.a{stroke:#475467;stroke-width:3;fill:none;marker-end:url(#arrow)}.d{stroke:#7952a8;stroke-width:2.5;stroke-dasharray:8 7;fill:none;marker-end:url(#arrowp)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475467"/></marker><marker id="arrowp" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7952a8"/></marker></defs><rect class="bg" width="1200" height="900" rx="24"/><text x="600" y="48" text-anchor="middle" class="t" style="font-size:30px">Arquitetura implementada — TFT Viewer</text>
<rect class="bl" x="90" y="95" width="450" height="145" rx="18"/><text class="t" x="315" y="132" text-anchor="middle">Política PPO · Python / PyTorch</text><text class="s" x="315" y="169" text-anchor="middle">Checkpoint carregado uma vez</text><text class="s" x="315" y="199" text-anchor="middle">Inferência determinística ou estocástica</text>
<rect class="gr" x="660" y="95" width="450" height="145" rx="18"/><text class="t" x="885" y="132" text-anchor="middle">ViewerSession · controlador</text><text class="s" x="885" y="169" text-anchor="middle">Ritmo, seed, pausa e avanço</text><text class="s" x="885" y="199" text-anchor="middle">Coordena ações dos 8 jogadores</text><path class="a" d="M540 167 H650"/><text class="s" x="595" y="151" text-anchor="middle" style="font-size:15px">ações</text><path class="a" d="M660 215 H550"/><text class="s" x="605" y="235" text-anchor="middle" style="font-size:15px">observações</text>
<rect class="or" x="290" y="310" width="620" height="150" rx="18"/><text class="t" x="600" y="350" text-anchor="middle">Engine C++ existente · Lobby de 8 jogadores</text><text class="s" x="600" y="388" text-anchor="middle">Regras, loja, economia, unidades, combate e recompensas</text><text class="s" x="600" y="420" text-anchor="middle">Snapshots de auditoria + resultado real das ações</text><path class="a" d="M885 240 V275 H800 V300"/><path class="a" d="M315 240 V275 H400 V300"/>
<rect class="pu" x="70" y="535" width="500" height="145" rx="18"/><text class="t" x="320" y="575" text-anchor="middle">Eventos em memória e replay</text><text class="s" x="320" y="612" text-anchor="middle">Decisões propostas e diagnóstico da policy</text><text class="s" x="320" y="642" text-anchor="middle">Snapshots e eventos retornados pela engine</text><rect class="bl" x="650" y="535" width="480" height="145" rx="18"/><text class="t" x="890" y="575" text-anchor="middle">Visualizador desktop</text><text class="s" x="890" y="612" text-anchor="middle">8 tabuleiros + foco individual</text><text class="s" x="890" y="642" text-anchor="middle">Linha do tempo, logs e painéis de debug</text><path class="a" d="M430 460 V500 H320 V525"/><path class="a" d="M770 460 V500 H470 V525"/><path class="a" d="M570 608 H640"/>
<rect class="b" x="180" y="745" width="840" height="95" rx="16"/><text class="t" x="600" y="782" text-anchor="middle">Persistência versionada da sessão</text><text class="s" x="600" y="813" text-anchor="middle">metadata.json + oito logs JSON por jogador</text><path class="d" d="M320 680 V720 H420 V735"/><path class="d" d="M890 680 V720 H780 V735"/><text class="s" x="600" y="878" text-anchor="middle" style="font-size:16px">A interface observa; não altera regras, recompensas ou pesos do PPO.</text></svg>