name: C++ native engine

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy pytest pybind11 tensorboard

      - name: Install CPU PyTorch for PPO integration tests
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Configure CMake
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build native modules and tests
        run: cmake --build cpp/build --parallel 2

      - name: Prepare test report directory
        if: always()
        run: mkdir -p artifacts

      - name: Run native CTest suite
        run: |
          set -o pipefail
          ctest --test-dir cpp/build --output-on-failure 2>&1 | tee artifacts/ctest.log

      - name: Validate Python adapter, PPO, scripts and viewer syntax
        run: python -m compileall -q cpp_lobby_env.py engine_contracts.py vector_lobby_env.py trainer.py ppo.py policy.py rollout.py scripts/evaluate_checkpoints.py scripts/audit_native_ppo_loops.py scripts/audit_item_system_e2e.py viewer tests

      - name: Run native engine integration and PPO contract tests
        env:
          PYTHONPATH: ${{ github.workspace }}/cpp/build/bin:${{ github.workspace }}
          REQUIRE_CPP_ENGINE: "1"
        run: >-
          python -m pytest -q
          --junitxml=artifacts/native-engine-tests.xml
          tests/test_tft_engine_api.py
          tests/test_native_ppo_loop_regression.py
          tests/test_native_ppo_loop_audit_helpers.py
          tests/test_lobby_end_to_end.py
          tests/test_full_match_terminal_ranking.py
          tests/test_combat_engine.py
          tests/test_combat_events.py
          tests/test_combat_movement.py
          tests/test_combat_stats.py
          tests/test_combat_profile_native.py
          tests/test_combat_timeout.py
          tests/test_determinismo_combate_cpp.py
          tests/test_integracao_combate_cpp.py
          tests/test_action_dimensions.py
          tests/test_action_mask_validation.py
          tests/test_ppo_mask_consistency.py
          tests/test_policy_bench_target_conditioning.py
          tests/test_strategic_policy.py
          tests/test_evaluate_checkpoints.py
          tests/test_audit_item_system_e2e.py
          tests/test_viewer_policy_diagnostics.py
          tests/test_viewer_preparation.py
          tests/test_viewer_player_logs.py

      - name: Publish native test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpp-native-engine-report
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
