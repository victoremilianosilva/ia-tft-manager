name: C++ native engine
# The same job also compiles and tests the isolated economy_finetuning package.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Qt runtime libraries for offscreen Viewer tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy pytest pybind11 tensorboard "rich>=13.7,<15" "PySide6>=6.7,<7"

      - name: Install CPU PyTorch for PPO integration tests
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Configure CMake
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build native modules and tests
        run: cmake --build cpp/build --parallel 2

      - name: Prepare test report directory
        if: always()
        run: mkdir -p artifacts

      - name: Run native CTest suite
        run: |
          set -o pipefail
          ctest --test-dir cpp/build --output-on-failure 2>&1 | tee artifacts/ctest.log

      - name: Validate Python adapter, PPO, scripts and viewer syntax
        run: python -m compileall -q cpp_lobby_env.py engine_contracts.py vector_lobby_env.py trainer.py train_native.py training_run_manifest.py ppo.py policy.py rollout.py scripts/run_training_battery.py reward_audit.py reward_outcome_producers.py reward_signal_calibration.py scripts/evaluate_checkpoints.py scripts/audit_native_ppo_loops.py scripts/audit_item_system_e2e.py scripts/generate_item_catalog.py viewer tests economy_finetuning

      - name: Run native engine integration and PPO contract tests
        env:
          PYTHONPATH: ${{ github.workspace }}/cpp/build/bin:${{ github.workspace }}
          REQUIRE_CPP_ENGINE: "1"
          QT_QPA_PLATFORM: "offscreen"
        run: >-
          python -m pytest -q
          --junitxml=artifacts/native-engine-tests.xml
          tests/test_tft_engine_api.py
          tests/test_cpp_lobby_snapshot_binding.py
          tests/test_reward_audit.py
          tests/test_reward_outcome_producers.py
          tests/test_reward_signal_calibration.py
          tests/test_rollout_decision_snapshot_identity.py
          tests/test_native_ppo_loop_regression.py
          tests/test_native_ppo_loop_audit_helpers.py
          tests/test_lobby_end_to_end.py
          tests/test_full_match_terminal_ranking.py
          tests/test_combat_engine.py
          tests/test_combat_events.py
          tests/test_combat_movement.py
          tests/test_combat_stats.py
          tests/test_combat_profile_native.py
          tests/test_combat_timeout.py
          tests/test_determinismo_combate_cpp.py
          tests/test_integracao_combate_cpp.py
          tests/test_action_dimensions.py
          tests/test_action_mask_validation.py
          tests/test_ppo_mask_consistency.py
          tests/test_shadow_ppo_isolation_architecture.py
          tests/test_shadow_multiround_replay.py
          tests/test_viewer_composition_widgets.py
          tests/test_structured_unit_uuid_schema_contract.py
          tests/test_viewer_shadow_planning_logs.py
          tests/test_viewer_session_shadow_projection.py
          tests/test_viewer_shadow_projection.py
          tests/test_policy_bench_target_conditioning.py
          tests/test_policy_item_conditioning.py
          tests/test_strategic_policy.py
          tests/test_evaluate_checkpoints.py
          tests/test_semantic_observation_projection.py
          tests/test_semantic_policy_input.py
          tests/test_semantic_rollout_alignment.py
          tests/test_checkpoint_contract.py
          tests/test_audit_item_system_e2e.py
          tests/test_generate_item_catalog.py
          tests/test_viewer_policy_diagnostics.py
          tests/test_viewer_preparation.py
          tests/test_viewer_player_logs.py
          tests/test_viewer_item_and_result_logging.py
          economy_finetuning/tests
          tests/test_training_config.py
          tests/test_vector_lobby_env_seed.py
          tests/test_native_training_manifest.py
          tests/test_training_battery.py

      - name: Run native PPO training smoke and verify checkpoint lineage
        env:
          PYTHONPATH: ${{ github.workspace }}/cpp/build/bin:${{ github.workspace }}
          REQUIRE_CPP_ENGINE: "1"
        run: |
          output_dir="${RUNNER_TEMP}/native-ppo-smoke"
          python train_native.py --output-dir "$output_dir" --seed 20261122 --updates 1 --lobbies 1 --rollout-steps 8 --batch-size 64 --ppo-epochs 1
          python - "$output_dir" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys
          import torch

          run_dir = pathlib.Path(sys.argv[1])
          checkpoint = torch.load(
              run_dir / "native_ppo_checkpoint.pt",
              map_location="cpu",
              weights_only=False,
          )
          manifest = json.loads((run_dir / "run_manifest.json").read_text(encoding="utf-8"))
          assert checkpoint["update"] == 1
          assert checkpoint["training_run_manifest"]["identity_sha256"] == manifest["identity_sha256"]
          assert manifest["algorithm"] == "PPO"
          assert manifest["engine"]["artifact_sha256"]
          assert checkpoint["optimizer"]["state"], "PPO optimizer performed no parameter updates"
          artifact = json.loads((run_dir / "artifact_manifest.json").read_text(encoding="utf-8"))
          checkpoint_sha = hashlib.sha256((run_dir / "native_ppo_checkpoint.pt").read_bytes()).hexdigest()
          assert artifact["checkpoint_sha256"] == checkpoint_sha
          assert artifact["completed_updates"] == 1
          print("Native PPO smoke produced a checkpoint with verified run lineage and artifact hash.")
          PY

      - name: Run native PPO multi-seed battery smoke
        env:
          PYTHONPATH: ${{ github.workspace }}/cpp/build/bin:${{ github.workspace }}
          REQUIRE_CPP_ENGINE: "1"
        run: |
          output_root="${RUNNER_TEMP}/native-ppo-battery-smoke"
          python scripts/run_training_battery.py --output-root "$output_root" --seeds 11,12 --updates 1 --lobbies 1 --rollout-steps 8 --batch-size 64 --ppo-epochs 1
          python - "$output_root" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          battery = json.loads((root / "battery_manifest.json").read_text(encoding="utf-8"))
          assert [run["seed"] for run in battery["runs"]] == [11, 12]
          for run in battery["runs"]:
              run_dir = root / run["run_dir"]
              checkpoint = run_dir / "native_ppo_checkpoint.pt"
              artifact = json.loads((run_dir / "artifact_manifest.json").read_text(encoding="utf-8"))
              assert checkpoint.is_file()
              assert hashlib.sha256(checkpoint.read_bytes()).hexdigest() == run["checkpoint_sha256"]
              assert artifact["weights_changed"] is True
              assert artifact["strict_reload_verified"] is True
          print("Native PPO multi-seed battery produced two independently identified checkpoints.")
          PY

      - name: Collect deterministic strategic replay artifact
        if: always()
        run: |
          if [ -f cpp/build/strategic_integrated_replay.jsonl ]; then
            cp cpp/build/strategic_integrated_replay.jsonl artifacts/
          fi

      - name: Publish native test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpp-native-engine-report
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
