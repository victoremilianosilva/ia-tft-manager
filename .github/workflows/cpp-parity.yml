name: C++ engine and cross-language parity

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy pytest pybind11 tensorboard

      - name: Install CPU PyTorch for PPO integration test
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Configure CMake
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build native modules and tests
        run: cmake --build cpp/build --parallel 2

      - name: Prepare test report directory
        if: always()
        run: mkdir -p artifacts

      - name: Run native CTest suite
        run: |
          set -o pipefail
          ctest --test-dir cpp/build --output-on-failure 2>&1 | tee artifacts/ctest.log

      - name: Validate viewer Python syntax
        run: python -m compileall -q viwer viewer tests/test_viewer_policy_diagnostics.py

      - name: Run required cross-language parity suite
        env:
          PYTHONPATH: \${{ github.workspace }}/cpp/build/bin:\${{ github.workspace }}
          REQUIRE_CPP_PARITY: "1"
        run: >-
          python -m pytest -q
          --junitxml=artifacts/cross-language-parity.xml
          tests/test_combat_engine.py
          tests/test_combat_events.py
          tests/test_combat_movement.py
          tests/test_combat_profile_data.py
          tests/test_combat_stats.py
          tests/test_combat_timeout.py
          tests/test_determinismo_combate_cpp.py
          tests/test_empty_team_combat.py
          tests/test_integracao_combate_cpp.py
          tests/test_lobby_combat_regression.py
          tests/test_reward_integration.py
          tests/test_round_economy_combat_flow.py
          tests/test_level_capacity_rules.py
          tests/test_economy_sell_values.py
          tests/test_tft_round_schedule.py
          tests/test_tft_engine_api.py
          tests/test_lobby_end_to_end.py
          tests/test_cross_language_replay.py
          tests/test_positioning_parity.py
          tests/test_reward_manager_parity.py
          tests/test_combat_profile_parity.py
          tests/test_synergy_manager_parity.py
          tests/test_action_mask_equivalence.py
          tests/test_action_mask_integration.py
          tests/test_anti_loop_mask_integration.py
          tests/test_anti_loop_swap_cycles.py
          tests/test_combat_economy_integration.py
          tests/test_self_play_economy_progression.py
          tests/test_shop_manager_odds.py
          tests/test_shared_pool_shop_validation.py
          tests/test_upgrade_integration.py
          tests/test_engine_backend_selection.py
          tests/test_evaluate_checkpoints.py
          tests/test_viewer_policy_diagnostics.py
          tests/test_four_area_audit_completion.py
          tests/test_full_match_terminal_ranking.py
          tests/test_anti_loop_regression.py
          tests/test_anti_loop_swap_back.py
          tests/test_anti_loop_position_cycles.py
          tests/test_anti_loop_useful_moves_audit.py
          tests/test_ppo_mask_consistency.py
          tests/test_reward_cpp_parity.py

      - name: Benchmark full Python engine vs native C++ engine
        env:
          PYTHONPATH: \${{ github.workspace }}/cpp/build/bin:\${{ github.workspace }}
        run: >-
          python benchmark_engine_python_vs_cpp.py
          --lobbies 1
          --steps 100
          --warmup 10
          --repeats 2
          --output artifacts/engine_python_vs_cpp_comparison.json

      - name: Publish native, parity, and benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpp-cross-language-parity-report
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
