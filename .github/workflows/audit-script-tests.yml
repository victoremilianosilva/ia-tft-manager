name: TFT unified audit tests

on:
  push:
    paths:
      - 'scripts/audit_viewer_match.py'
      - 'scripts/test_audit_viewer_match.py'
      - 'viewer/audit_window.py'
      - 'viewer/player_logs.py'
      - 'viewer/session.py'
      - 'viewer/main.py'
      - '.github/workflows/audit-script-tests.yml'
  pull_request:
    paths:
      - 'scripts/audit_viewer_match.py'
      - 'scripts/test_audit_viewer_match.py'
      - 'viewer/audit_window.py'
      - 'viewer/main.py'
      - '.github/workflows/audit-script-tests.yml'

jobs:
  audit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m py_compile scripts/audit_viewer_match.py scripts/test_audit_viewer_match.py viewer/audit_window.py viewer/main.py viewer/player_logs.py viewer/session.py
      - name: Run audit regression tests
        run: python -m unittest -v scripts/test_audit_viewer_match.py
