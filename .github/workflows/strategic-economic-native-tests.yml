name: Strategic and economic native tests

on:
  push:
    paths:
      - 'cpp/CMakeLists.txt'
      - 'cpp/include/strategy/**'
      - 'cpp/include/composition_intelligence/**'
      - 'cpp/include/lobby/TftEngine.hpp'
      - 'cpp/src/lobby/TftEngine.cpp'
      - 'cpp/bindings/tft_engine_bindings.cpp'
      - 'cpp/tests/test_strategic_planner.cpp'
      - 'tests/test_strategic_evidence_context_architecture.py'
      - 'cpp/tests/test_native_strategic_composition_generator.cpp'
      - 'cpp/tests/test_strategic_evidence_context.cpp'
      - 'cpp/tests/test_strategic_action_executor.cpp'
      - 'cpp/tests/test_strategic_position_planner.cpp'
      - 'cpp/tests/test_active_composition_manager.cpp'
      - 'cpp/tests/test_composition_evaluation.cpp'
      - 'cpp/tests/test_pivot_feasibility_evaluator.cpp'
      - 'cpp/tests/test_strategic_pivot_transition_coordinator.cpp'
      - 'cpp/tests/test_unit_priority_planner.cpp'
      - 'cpp/tests/test_strategic_direction_pivot_audit_recorder.cpp'
      - 'cpp/tests/test_tft_engine_pool.cpp'
      - 'cpp/include/composition_intelligence/ShadowFailureBoundary.hpp'
      - 'cpp/tests/test_shadow_failure_boundary.cpp'
      - 'tests/test_shadow_ppo_isolation_architecture.py'
      - 'tests/test_strategic_evidence_context_architecture.py'
      - 'tests/test_strategic_evidence_context_architecture.py'
      - 'docs/shadow-ppo-isolation-contract.md'
      - '.github/workflows/strategic-economic-native-tests.yml'
  pull_request:
    paths:
      - 'cpp/CMakeLists.txt'
      - 'cpp/tests/test_native_strategic_composition_generator.cpp'
      - 'cpp/tests/test_strategic_evidence_context.cpp'
      - 'cpp/tests/test_strategic_action_executor.cpp'
      - 'cpp/tests/test_active_composition_manager.cpp'
      - 'cpp/tests/test_composition_evaluation.cpp'
      - 'cpp/tests/test_pivot_feasibility_evaluator.cpp'
      - 'cpp/tests/test_strategic_pivot_transition_coordinator.cpp'
      - 'cpp/tests/test_unit_priority_planner.cpp'
      - 'cpp/include/strategy/**'
      - 'cpp/include/composition_intelligence/**'
      - 'cpp/include/lobby/TftEngine.hpp'
      - 'cpp/src/lobby/TftEngine.cpp'
      - 'cpp/bindings/tft_engine_bindings.cpp'
      - 'cpp/tests/test_strategic_planner.cpp'
      - 'cpp/tests/test_strategic_direction_pivot_audit_recorder.cpp'
      - 'cpp/tests/test_tft_engine_pool.cpp'
      - '.github/workflows/strategic-economic-native-tests.yml'

jobs:
  native-shadow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pybind11
        run: python -m pip install pybind11
      - name: Configure CMake
        run: cmake -S cpp -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build native engine and strategic planner tests
        run: cmake --build build --target tft_engine test_tft_engine_pool test_strategic_planner test_shadow_failure_boundary test_strategic_direction_pivot_audit_recorder test_native_strategic_composition_generator test_strategic_evidence_context test_strategic_action_executor test_strategic_position_planner test_active_composition_manager test_composition_evaluation test_pivot_feasibility_evaluator test_strategic_pivot_transition_coordinator test_unit_priority_planner --config Release --parallel 2
      - name: Run strategic planner regression tests
        run: ctest --test-dir build -R 'tft_engine_pool|strategic_planner_shadow|shadow_failure_boundary|strategic_direction_pivot_audit_recorder|native_strategic_composition_generator|strategic_evidence_context|strategic_action_executor|strategic_position_planner|active_composition_manager|composition_evaluation|pivot_feasibility_evaluator|strategic_pivot_transition_coordinator|unit_priority_planner' --output-on-failure
      - name: Verify PPO Shadow architecture boundary
        run: python tests/test_shadow_ppo_isolation_architecture.py
      - name: Verify strategic evidence context isolation
        run: python tests/test_strategic_evidence_context_architecture.py
