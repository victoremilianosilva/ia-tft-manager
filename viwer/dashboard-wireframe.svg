<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc"><title id="title">Wireframe conceitual da tela do TFT Viewer</title><desc id="desc">Painel com oito mini-tabuleiros, detalhes do agente selecionado, log e controles de replay.</desc><defs><style>.bg{fill:#f5f7fa}.panel{fill:#fff;stroke:#c7ced8;stroke-width:2}.dark{fill:#202b3c}.t{font:700 22px Arial,sans-serif;fill:#182230}.w{font:700 21px Arial,sans-serif;fill:#fff}.s{font:16px Arial,sans-serif;fill:#465467}.tiny{font:14px Arial,sans-serif;fill:#465467}.cell{fill:#e8edf3;stroke:#c3ccd8;stroke-width:1}.unit{fill:#6a91bf}.unit2{fill:#69a58a}.selected{stroke:#d28b30;stroke-width:4}.line{stroke:#d6dce5;stroke-width:1}</style></defs><rect class="bg" width="1200" height="850" rx="20"/><rect class="dark" x="20" y="20" width="1160" height="64" rx="12"/><text class="w" x="45" y="60">TFT AI Viewer</text><text class="w" x="1150" y="60" text-anchor="end" style="font-size:16px">Sessão · checkpoint · seed</text><rect class="panel" x="20" y="104" width="800" height="620" rx="14"/><text class="t" x="42" y="139">Visão geral — 8 agentes</text>