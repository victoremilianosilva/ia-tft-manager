<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc"><title id="title">Ciclo de auditoria de uma decisão PPO</title><desc id="desc">Sequência que registra estado, calcula política, valida ação, executa lote, compara snapshots e persiste evento para replay.</desc><defs><style>.bg{fill:#f8fafc}.p{fill:#e8f1ff;stroke:#3973ac;stroke-width:2}.g{fill:#e9f7ef;stroke:#32835a;stroke-width:2}.o{fill:#fff0df;stroke:#b76b1e;stroke-width:2}.v{fill:#f2eaff;stroke:#7952a8;stroke-width:2}.t{font:700 22px Arial,sans-serif;fill:#182230}.s{font:17px Arial,sans-serif;fill:#344054}.a{stroke:#475467;stroke-width:3;fill:none;marker-end:url(#arrow)}.d{stroke:#7952a8;stroke-width:2.5;stroke-dasharray:8 7;fill:none;marker-end:url(#arrowp)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475467"/></marker><marker id="arrowp" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7952a8"/></marker></defs><rect class="bg" width="1200" height="1050" rx="22"/><text class="t" x="600" y="48" text-anchor="middle" style="font-size:30px">Ciclo de auditoria de uma decisão</text>
<rect class="p" x="250" y="90" width="700" height="100" rx="16"/><text class="t" x="600" y="128" text-anchor="middle">1. Capturar estado de decisão</text><text class="s" x="600" y="160" text-anchor="middle">Observação PPO + máscaras + snapshot de auditoria</text><path class="a" d="M600 190 V225"/>
<rect class="p" x="250" y="230" width="700" height="110" rx="16"/><text class="t" x="600" y="270" text-anchor="middle">2. Executar inferência sem gradientes</text><text class="s" x="600" y="302" text-anchor="middle">Modo determinístico ou estocástico · ação e diagnósticos</text><path class="a" d="M600 340 V375"/>
<rect class="o" x="250" y="380" width="700" height="110" rx="16"/><text class="t" x="600" y="420" text-anchor="middle">3. Registrar e validar ação proposta</text><text class="s" x="600" y="452" text-anchor="middle">Componentes, máscaras, probabilidades e motivo de rejeição</text><path class="a" d="M600 490 V525"/>
<rect class="g" x="250" y="530" width="700" height="110" rx="16"/><text class="t" x="600" y="570" text-anchor="middle">4. Executar o lote na engine C++</text><text class="s" x="600" y="602" text-anchor="middle">Coordenar os 8 jogadores no mesmo lobby</text><path class="a" d="M600 640 V675"/>
<rect class="g" x="250" y="680" width="700" height="110" rx="16"/><text class="t" x="600" y="720" text-anchor="middle">5. Capturar resultado e estado posterior</text><text class="s" x="600" y="752" text-anchor="middle">Diferença de estado · recompensa · combate · eliminação</text><path class="a" d="M600 790 V825"/>
<rect class="v" x="250" y="830" width="700" height="110" rx="16"/><text class="t" x="600" y="870" text-anchor="middle">6. Persistir evento e snapshot</text><text class="s" x="600" y="902" text-anchor="middle">Sequência ordenada, referências e metadados de sessão</text><path class="d" d="M950 885 H1080 V140 H960"/><text class="s" x="1090" y="510" text-anchor="middle" transform="rotate(90 1090 510)">Replay lê dados gravados</text><text class="s" x="600" y="990" text-anchor="middle">Ação proposta não é considerada executada até a engine confirmar o resultado.</text></svg>